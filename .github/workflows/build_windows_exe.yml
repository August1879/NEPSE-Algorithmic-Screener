name: Build Windows Executable (.exe)

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'data/**'
      - 'output/**'
      - '*.md'
      - '.gitignore'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller PyQt6 PyQt6-WebEngine

      - name: Build Standalone Windows Application with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "NEPSE_Algorithmic_Screener" main.py

      - name: Compress Release Folder to Zip
        run: |
          Compress-Archive -Path dist/NEPSE_Algorithmic_Screener -DestinationPath dist/NEPSE_Algorithmic_Screener_Windows.zip

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'latest' }}
          name: "NEPSE Screener ${{ github.ref_name || '(Latest Build)' }}"
          files: dist/NEPSE_Algorithmic_Screener_Windows.zip
          draft: false
          prerelease: false
