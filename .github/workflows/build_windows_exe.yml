name: Build Windows Executable (.exe)

on:
  workflow_dispatch: # 1-click manual trigger

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller PyQt6

      - name: Build Standalone Windows .exe with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "NEPSE_Algorithmic_Screener" main.py

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEPSE_Algorithmic_Screener_Windows_Exe
          path: dist/NEPSE_Algorithmic_Screener.exe
          retention-days: 30
