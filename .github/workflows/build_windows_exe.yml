name: Build Windows Executable (.exe)

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'data/**'
      - 'output/**'
      - '*.md'
      - '.gitignore'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller PyQt6 PyQt6-WebEngine

      - name: Build Standalone Windows .exe with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "NEPSE_Algorithmic_Screener" --exclude-module PyQt6.QtQuick --exclude-module PyQt6.QtQml --exclude-module PyQt6.QtPdf --exclude-module PyQt6.QtBluetooth main.py

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && format('NEPSE Screener {0}', github.ref_name) || 'NEPSE Screener (Latest Build)' }}
          files: dist/NEPSE_Algorithmic_Screener.exe
          draft: false
          prerelease: false
