name: Build Windows Executable (.exe)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller PyQt6 PyQt6-WebEngine

      - name: Build Standalone Windows .exe with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "NEPSE_Algorithmic_Screener" `
            --exclude-module PyQt6.QtQuick `
            --exclude-module PyQt6.QtQml `
            --exclude-module PyQt6.QtPdf `
            --exclude-module PyQt6.QtNetwork `
            --exclude-module PyQt6.QtBluetooth `
            main.py

      - name: Publish to GitHub Releases (High-Speed CDN)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "NEPSE Screener v1.0.0"
          files: dist/NEPSE_Algorithmic_Screener.exe
          draft: false
          prerelease: false
