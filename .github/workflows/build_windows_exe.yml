name: Build Windows Executable (.exe)

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "data/**"
      - "output/**"
      - "*.md"
      - ".gitignore"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller PyQt6 PyQt6-WebEngine

      - name: Download Offline TradingView Script
        run: |
          python -c "import urllib.request; urllib.request.urlretrieve('https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js', 'view/lightweight-charts.standalone.production.js')"

      - name: Build Standalone Windows Application with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --noconsole --name "NEPSE_Algorithmic_Screener" --collect-all PyQt6.QtWebEngineWidgets --collect-all PyQt6.QtWebEngineCore --add-data "view/lightweight-charts.standalone.production.js;view" main.py

      - name: Automated Smoke-Test on Windows Runner
        shell: powershell
        run: |
          $proc = Start-Process -FilePath "dist\NEPSE_Algorithmic_Screener\NEPSE_Algorithmic_Screener.exe" -PassThru
          Start-Sleep -Seconds 6
          if ($proc.HasExited) {
              $code = $proc.ExitCode
              if ($code -ne 0 -or (Test-Path crash_log.txt)) {
                  Write-Error "Executable crashed on launch with exit code $code"
                  if (Test-Path crash_log.txt) { Get-Content crash_log.txt }
                  exit 1
              }
          } else {
              Write-Output "SUCCESS: Executable successfully launched GUI and is running cleanly!"
              Stop-Process -Id $proc.Id -Force
          }

      - name: Compress Release Folder to Zip
        run: |
          Compress-Archive -Path dist/NEPSE_Algorithmic_Screener -DestinationPath dist/NEPSE_Algorithmic_Screener_Windows.zip

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'latest' }}
          name: "NEPSE Screener ${{ github.ref_name || '(Latest Build)' }}"
          files: dist/NEPSE_Algorithmic_Screener_Windows.zip
          draft: false
          prerelease: false
