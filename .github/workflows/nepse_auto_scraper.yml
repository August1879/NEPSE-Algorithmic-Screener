name: NEPSE Live 1-Minute Market Session

on:
  schedule:
    # 05:15 UTC = 11:00 AM Nepal Time, Sunday through Thursday (0-4)
    - cron: "15 5 * * 0-4"
  workflow_dispatch: # Allows 1-click manual start anytime

jobs:
  live-market-session:
    runs-on: ubuntu-latest
    timeout-minutes: 270 # Stays alive for 4.5 hours
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Continuous Live Market Logger (11:00 AM - 03:00 PM NPT)
        run: |
          python main.py --schedule --interval 1

      - name: Commit and push day's 1-minute dataset to repository
        if: always() # Guarantees data is saved even if session is interrupted
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Save 1-minute intraday market session data [skip ci]" && git push)
