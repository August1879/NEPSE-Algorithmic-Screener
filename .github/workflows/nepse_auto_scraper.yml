name: NEPSE Live 1-Minute Market Session

on:
  schedule:
    - cron: "15 5 * * 0-4"
  workflow_dispatch:

jobs:
  live-market-session:
    runs-on: ubuntu-latest
    timeout-minutes: 270
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Continuous Live Market Logger
        run: |
          python main.py --schedule --interval 1 --stop-on-close

      - name: Commit and push day's dataset
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if [ -d "output" ]; then git add output/; fi
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Save 1-minute intraday market session data [skip ci]" || true
            git pull --rebase origin main || (git rebase --abort && git pull -s recursive -X ours origin main) || true
            git push origin HEAD:main
          fi
