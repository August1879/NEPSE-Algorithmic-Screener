name: NEPSE Automated Scraper & Screener

on:
  schedule:
    # 09:30 UTC = 03:15 PM Nepal Time (NPT), Sunday through Thursday (0-4) - Market Close
    - cron: "30 9 * * 0-4"
    # 05:15 UTC = 11:00 AM Nepal Time (NPT), Sunday through Thursday (0-4) - Market Open
    - cron: "15 5 * * 0-4"
  workflow_dispatch: # Allows 1-click manual trigger from GitHub anytime

jobs:
  scrape-and-screen:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run NEPSE Screener and Ingestion
        run: |
          python main.py --cli --all

      - name: Commit and push updated database to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update NEPSE market data & signals [skip ci]" && git push)
